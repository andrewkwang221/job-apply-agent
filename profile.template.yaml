# Copy this file to profile.yaml and fill in your details.
# profile.yaml is git-ignored to protect your personal information.

personal:
  name: "Jane Doe"
  email: "jane@example.com"
  phone: "555-0100"              # local number without country code
  phone_country_code: "1"        # numeric country code — prepended when no separate country field exists
  phone_country: "Canada"
  linkedin: "https://www.linkedin.com/in/janedoe/"
  github: "https://github.com/janedoe"
  location: "Toronto, Canada"
  timezone: "EST"
  strongest_language: "Python"       # used for "strongest programming language" fields
  second_language: "SQL"             # used for "preferred/second programming language" fields
  age: 30                            # used to auto-select age-range buckets (18-24, 25-34, … 75+)
  years_experience: 10               # used to answer "how many years of experience?" dropdowns
  current_company: "Example Corp"    # used for employment / current employer fields
  current_title: "Senior Engineer"   # used for current job title fields

# Repeating employment/education rows for ATS history sections (Dice, Greenhouse, …).
work_history:
  - company: "Example Corp"
    title: "Senior Engineer"
    from: "Jan 2022"
    to: "present"
  - company: "Previous Co"
    title: "Engineer"
    from: "Jun 2018"
    to: "Dec 2021"

education:
  - school: "Example University"
    degree: "Bachelor's"
    field: "Computer Science"
    from: "2014"
    to: "2018"

summary:
  - "Short optional bullets describing seniority, domain strengths, and notable background."
  - "Useful for LLM analysis prompts when titles or keyword lists alone miss prior experience."

skills:
  - Python
  - SQL
  - Docker
  - AWS

keywords:
  - software
  - backend
  - api

target_roles:
  - software engineer
  - backend developer
  - full stack engineer

seniority:  # persist skip + scoring; titles with no level word are kept
  preferred:
    - senior
    - staff
  acceptable:
    - mid
    - lead

# Curated company list. careers_url is the ground truth — ATS is auto-detected from the host.
# Supported hosts: jobs.ashbyhq.com, boards.greenhouse.io, job-boards.greenhouse.io,
#                  jobs.lever.co, apply.workable.com
# Leave empty until you add real boards. Fixture slugs (examplecorp, anotherco, acme, …)
# are skipped and never probed.
target_companies: []
# Example:
# target_companies:
#   - { name: "OpenAI", careers_url: "https://jobs.ashbyhq.com/openai" }
#   - { name: "Stripe", careers_url: "https://boards.greenhouse.io/stripe" }

blacklisted_companies:
  - Example Blacklisted Co

languages:
  - english

preferences:
  remote_only: true
  accepted_regions:
    - worldwide
    - global
    - emea
    - europe
    - canada
  reject_regions:
    - us only
  contractor_ok: true
  availability:
    - long term
    - permalance

work_authorization:
  canada: true
  sponsorship_required: false

resumes:
  - name: "general_swe"
    path: "resumes/jane_doe_swe.pdf"
    tags:
      - software
      - backend
      - api

# Credentials for job board sites that require login before you can apply.
# Used by the prefill automation to log in automatically.
# profile.yaml is git-ignored — credentials are never committed.
credentials:
  # Gmail App Password for auto-filling Greenhouse security codes.
  # Setup: enable IMAP in Gmail → create App Password at
  # https://myaccount.google.com/apppasswords (requires 2-Step Verification).
  gmail:
    app_password: "xxxx xxxx xxxx xxxx"
  himalayas.app:
    email: "jane@example.com"
    password: "your_password"
